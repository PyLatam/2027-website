# Fly.io app for the Django site. Shape decided in docs/django-migration.md
# ("Decided: hosting on Fly.io"). Deploy from this directory:
#   flyctl deploy --remote-only
#
# Fly's abuse filter rejects app names containing "latam", hence "pyconlat".
# This is the test deploy on fly.dev: it is marked noindex and the real domain
# (2027.pylatam.org) still points at the React site on GitHub Pages.

app = "pyconlat-2027-test"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "pyconlat-2027-test.fly.dev"
  DJANGO_NOINDEX = "1"
  # DJANGO_SECRET_KEY is a secret: `flyctl secrets set DJANGO_SECRET_KEY=...`

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: no cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    # The check comes from inside Fly, without the proxy's scheme header.
    [http_service.checks.headers]
      Host = "pyconlat-2027-test.fly.dev"
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

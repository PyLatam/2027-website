name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The React site lives in legacy-react/ while the Django port is built in
    # web/. See docs/django-migration.md.
    defaults:
      run:
        working-directory: legacy-react
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy-react/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run build

  verify-django:
    runs-on: ubuntu-latest
    # The Django port in web/. Runs on every PR so a broken change cannot reach
    # main, where fly-deploy.yml would try to deploy it.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.13'

      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python manage.py check
      - run: uv run python manage.py test
